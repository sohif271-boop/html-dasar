<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <table border="1" height="100" width="40">
        <tr>
            <td>1</td>
            <td>2</td>
            <td>3</td>
        </tr>
        <tr>
            <td>4</td>
            <td>5</td>
            <td>6</td>
        </tr>
    </table>

    <br>
    <table border="2" height="100%" width="70%" cellpadding="100" cellspacing="20">
        <tr>
            <td>1</td>
            <td>2</td>
            <td>3</td>
        </tr>
        <tr>
            <td>4</td>
            <td>5</td>
            <td>6</td>
        </tr>
    </table>
    <br>

    <table border="2" height="100%" width="200" cellspacing="20">
        <tr>
            <td align="right" valign="bottom">sohif</td>
            <td align="center">sohif</td>
            <td>sohif</td>
            <td>sohif</td>
        </tr>
        <tr>
            <td>yasmine</td>
            <td>yasmine</td>
            <td>yasmine</td>
            <td>yasmine</td>
        </tr>
    </table>
    <br>

    <table border="1" cellspacing="20">
        <tr>
            <td height="100" valign="top">yasmine</td>
        </tr>
    </table>
    <br>


    <table border="1" width="100" height="90" cellpadding="10" cellspacing="20">
        <tr>
            <td>nama</td>
            <td rowspan="2" valign="top">alamat</td>
            <td>tanggal lahir</td>
        </tr>
        <tr>
            <td colspan="2">sohif fudin anwarul huda</td>
        </tr>
    </table>
</body>
</html>
